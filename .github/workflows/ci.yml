name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.rust == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        # `beta` is a warning shot for changes coming to stable. It does not run
        # the UI fixtures; those are pinned in the `ui` job below.
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  ui:
    # trybuild fixtures record rustc's exact wording, so they run on one pinned
    # version. Bumping it means regenerating them:
    #   TRYBUILD=overwrite TRYBUILD_UI=1 cargo test -p closed-trait --test ui
    name: UI fixtures (rustc 1.98.0)
    runs-on: ubuntu-latest
    env:
      TRYBUILD_UI: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          # `enumerate_needs_sized_types.stderr` quotes a snippet of `core`, and
          # rustc can only print that when the stdlib source is on disk. Without
          # this the note appears with its path but no code, and the fixture
          # mismatches. That is a difference in environment, not in compiler version.
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p closed-trait --test ui

  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  docs:
    name: Rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps

  msrv:
    name: MSRV 1.85.0
    runs-on: ubuntu-latest
    env:
      # Not `-D warnings`: 1.85 fires `unused_macro_definition` on generated
      # macros that stable does not. This job asks whether the crate still
      # compiles on the declared MSRV, not whether it is warning-free there.
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"
      - uses: Swatinem/rust-cache@v2
      # `check`, not `test`: the trybuild fixtures are pinned to stable's
      # diagnostic wording and would mismatch on an older compiler.
      - run: cargo check --workspace --all-targets

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Builds both crates from inside their archives, which is what catches a
      # README or LICENSE symlink that has stopped resolving.
      - run: cargo publish --workspace --dry-run
