[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
authors = ["ZwenDo"]
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ZwenDo/closed-trait"
keywords = ["sealed", "trait", "macro", "enum", "match"]
rust-version = "1.85.0"

version = "0.1.0"

[workspace.dependencies]
# No `version`: a path-only dev-dependency is stripped when publishing, which is
# what keeps this cycle from deadlocking against the unpublished facade.
closed-trait = { path = "crates/closed-trait" }
